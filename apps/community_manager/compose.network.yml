# Optional: attach only the manager and assessment containers to an existing Redis/foundation network.
services:
  community-manager-api:
    networks: [foundation]
  community-manager-worker:
    networks: [foundation]
  community-manager-scheduler:
    networks: [foundation]
  community-customer-worker:
    networks: [foundation]
networks:
  foundation:
    external: true
    name: ${COMMUNITY_MANAGER_NETWORK:?Set the existing foundation network}
