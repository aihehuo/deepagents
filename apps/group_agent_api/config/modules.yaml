# Group Agent module / check switches (TSD-14 §4.4).
# Secrets, URLs, and queue settings stay in ENV — not here.
#
# This is the single place to oversee brain Module / Check toggles.
# Path override for tests only: GROUP_AGENT_MODULES_CONFIG=/path/to/file.yaml

version: 1
preset: current

context:
  ctx.system.role_and_goal: true
  ctx.system.network_donts: true

checks:
  chk.action_claim: true
  chk.invented_candidate: true
  chk.reply_fact_grounding_llm: true
  chk.capability_guard: true
  chk.finalize_templates: true
  chk.invite_scaffold: true
  chk.invite_llm_polish: true

modules:
  # Semantic reply-vs-candidate-facts gate (TSD-14 §4.6). Default on.
  mod.brain.reply_grounding: true
  # Multi-level search (TSD-14 §8.12). Default off ≡ today's single-shot.
  # When on, model may re-call search_candidates with relax_level (D-B03: no
  # orchestrator auto-search).
  mod.brain.search_relax: false
  # Prefer pool=agent_profiles when on (TSD-14 §8.13). Default off ≡ all_reachable.
  # Precedence: model-supplied known pool wins; omitted → Module default;
  # agent_profiles while off → fall back all_reachable + profile_pool_hook audit.
  mod.brain.profile_pool: false

reply_grounding:
  # Includes the first check (TSD-14 §4.6.4).
  max_attempts: 2

search_relax:
  # Inclusive levels from 0 when module on (2 → L0 hard + L1 drop soft facets).
  max_levels: 2

debug:
  module_spans: true
  reply_diff: false

ingress:
  max_attempts: 3
