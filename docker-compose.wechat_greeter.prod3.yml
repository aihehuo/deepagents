services:
  wechat-greeter-api:
    image: ${WECHAT_GREETER_IMAGE:?set WECHAT_GREETER_IMAGE}
    container_name: wechat-greeter-api
    user: "1000:1000"
    ports:
      - "127.0.0.1:8005:8005"
    env_file:
      - /mnt/wechat-greeter/.docker.env
    environment:
      HOME: /home/appuser
      PYTHONPATH: /app/libs/deepagents:/app/libs
    networks:
      - aihehuo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import http.client; c=http.client.HTTPConnection('localhost',8005); c.request('GET','/healthz'); r=c.getresponse(); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  wechat-greeter-worker:
    image: ${WECHAT_GREETER_IMAGE:?set WECHAT_GREETER_IMAGE}
    container_name: wechat-greeter-worker
    user: "1000:1000"
    command: ["celery", "-A", "apps.wechat_greeter_worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "wechat_greeter"]
    env_file:
      - /mnt/wechat-greeter/.docker.env
    environment:
      HOME: /home/appuser
      PYTHONPATH: /app/libs/deepagents:/app/libs
    networks:
      - aihehuo-net
    restart: unless-stopped

networks:
  aihehuo-net:
    external: true
    name: aihehuo-net
