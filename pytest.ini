[pytest]
asyncio_mode = auto
markers =
    timeout: mark test with a timeout (durations in seconds)
    integration: integration tests that require external services / real LLM credentials
    container_e2e: container integration e2e test suite
    l1: level 1 contract and smoke test suite
    l2: level 2 scenario and behavior test suite
    l3: level 3 scale and resilience test suite
    real_llm: consumes real LLM quota; skipped unless GROUP_AGENT_REAL_LLM_TEST=1
    brain_sut: brain-as-SUT harness with contract-shaped ear/hand/mouth fakes

# This repo contains multiple subprojects under `libs/` with their own test suites
# and (sometimes) optional dependencies / different import expectations.
# Default root-level `pytest` should only collect the top-level `./tests` suite.
testpaths =
    tests

